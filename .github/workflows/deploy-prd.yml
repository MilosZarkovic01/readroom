name: Deploy PRD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prd
  cancel-in-progress: false

env:
  DATABASE_URL: file:./prisma/ci.db
  AUTH_SECRET: ci-test-secret-at-least-32-characters-long
  AUTH_TRUST_HOST: "true"
  VERCEL_ORG_ID: team_BnctOpMLBBKEN2HLhthiSRuY
  VERCEL_PROJECT_ID: prj_pouW6gfNItYq5iHSHXNtLQOs1Hz7

jobs:
  test:
    name: Test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=prisma/schema.prisma
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build:
    name: Build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ci

  deploy-prd:
    name: Deploy PRD
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: [test, build]
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check deploy token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not set."
            echo "Create a Vercel token at https://vercel.com/account/tokens"
            echo "Then add a repository secret named VERCEL_TOKEN at"
            echo "https://github.com/MilosZarkovic01/readroom/settings/secrets/actions"
            echo "or as a Production environment secret at"
            echo "https://github.com/MilosZarkovic01/readroom/settings/environments"
            exit 1
          fi
      - run: npm ci
      - run: npm install -g vercel@latest
      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_BnctOpMLBBKEN2HLhthiSRuY","projectId":"prj_pouW6gfNItYq5iHSHXNtLQOs1Hz7","projectName":"readroom"}' > .vercel/project.json
      - name: Pull production environment
        run: vercel pull --yes --environment=production --scope zarkovic-m
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build production artifact
        run: vercel build --prod --scope zarkovic-m
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --scope zarkovic-m
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  refuse-non-master:
    name: Master only
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse other branches
        run: |
          echo "Deploy PRD can only be started from the master branch."
          echo "Open Actions → Deploy PRD → Run workflow and choose master."
          exit 1
